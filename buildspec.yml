version: 0.2

phases:
  pre_build:
    commands:
      - echo "Autenticando no Amazon ECR..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - AWS_REGION=us-east-1
      - ECR_REPOSITORY=bia
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $IMAGE_URI
      - echo "IMAGE_URI=$IMAGE_URI"

  build:
    commands:
      - echo "Build da imagem Docker..."
      - docker build -t bia .
      - docker tag bia:latest $IMAGE_URI:latest

  post_build:
    commands:
      - echo "Enviando imagem para o ECR..."
      - docker push $IMAGE_URI:latest
      - echo "Gerando imagedefinitions.json para deploy no ECS..."
      - printf '[{"name":"bia","imageUri":"%s"}]' "$IMAGE_URI:latest" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
